name: CI/CD AutoCatira

on:
  push:
    branches: [main, dev, "feat/**", "fix/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. BUILD + TESTES DO BACKEND ----------
  backend:
    name: Backend - build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: autocatira_test
          MYSQL_USER: autocatira
          MYSQL_PASSWORD: autocatira
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: autocatira_test
      DB_USER: autocatira
      DB_PASSWORD: autocatira
      JWT_SECRET: segredo-de-teste-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Build (TypeScript)
        run: npm run build
      - name: Testes automatizados (Vitest + Supertest + MySQL)
        run: npm run test:run

  # ---------- 2. CHECAGEM DO APP MOBILE ----------
  mobile:
    name: Mobile - checagem de tipos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit -p .

  # ---------- 3. DEPLOY: IMAGEM DOCKER ----------
  # Em todo push: valida que a imagem do backend é construída.
  # Na main: publica no GitHub Container Registry com a tag do commit
  # (permite rollback para qualquer versão anterior) e "latest".
  deploy:
    name: Deploy - imagem Docker do backend
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome da imagem em minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/autocatira-backend" >> $GITHUB_ENV
      - name: Build (e push na main)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
