
# ---------- HTTP (porta 80) ----------
# A API fica disponível em HTTP para o aplicativo mobile, que não aceita
# o certificado autoassinado. O site web é redirecionado para HTTPS.
server {
    listen 80 default_server;
    server_name autocatira.local localhost _;

    location /api/ {
        client_max_body_size 10M;
        proxy_pass http://backend:3333/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS (porta 443) ----------
server {
    listen 443 ssl;
    server_name autocatira.local;

    ssl_certificate /etc/nginx/certs/autocatira.local.pem;
    ssl_certificate_key /etc/nginx/certs/autocatira.local-key.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'";

    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 10M;
        proxy_pass http://backend:3333/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
