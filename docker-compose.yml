services:
  # ----------------------------------------
  # BANCO DE DADOS (MySQL)
  # ----------------------------------------
  db:
    image: mysql:8.0
    container_name: autocatira_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - autocatira_network

  # ----------------------------------------
  # CACHE E MENSAGERIA (Redis)
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: autocatira_redis
    restart: always
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - autocatira_network

  # ----------------------------------------
  # BACK-END (API Node.js) - acessado somente via Nginx
  # ----------------------------------------
  backend:
    build: ./backend
    container_name: autocatira_backend
    restart: always
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - autocatira_network

  # ----------------------------------------
  # FRONT-END (Interface React)
  # ----------------------------------------
  frontend:
    build: ./frontend
    container_name: autocatira_frontend
    restart: always
    environment:
      - REACT_APP_API_URL=/api
    depends_on:
      - backend
    networks:
      - autocatira_network

  # ----------------------------------------
  # NGINX (proxy reverso - única porta aberta)
  # ----------------------------------------
  nginx:
    image: nginx:alpine
    container_name: autocatira_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - autocatira_network

# ----------------------------------------
# VOLUMES E REDES
# ----------------------------------------
volumes:
  db_data:

networks:
  autocatira_network:
    driver: bridge
